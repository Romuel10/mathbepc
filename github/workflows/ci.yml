name: Vérification MathBEPC

on:
  push:
    branches: [main, fix-complete-project, v2-learning, v3-programme-bepc]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier TypeScript, les tests et la compilation
        run: npm run check
