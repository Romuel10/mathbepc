name: Construire APK Android MathBEPC

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances web
        run: npm install --no-audit --no-fund

      - name: Vérifier le projet
        run: npm run check

      - name: Installer Capacitor
        run: npm install --no-save --no-package-lock @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/cli@8.5.2

      - name: Construire le site
        run: npm run build

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compiler l'APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Nommer l'APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifact/MathBEPC-v${VERSION}.apk"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MathBEPC-Android
          path: artifact/MathBEPC-v*.apk
          if-no-files-found: error
          retention-days: 30
