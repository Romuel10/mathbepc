name: Android Release signé (APK + AAB)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier les secrets de signature
        run: |
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 manquant" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD manquant" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS manquant" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD manquant" && exit 1)
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Lire la version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Auditer les dépendances de production
        run: npm run audit:deps
      - run: npm run check
      - name: Installer Capacitor
        run: npm install --no-save --no-package-lock @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/cli@8.5.2
      - run: npm run build
      - name: Créer Android et appliquer l'identité visuelle
        run: |
          npx cap add android
          npx cap sync android
          node scripts/apply-android-branding.mjs
      - name: Installer le keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/mathbepc-release.jks
      - name: Ajouter la signature Release
        run: |
          cat >> android/gradle.properties <<PROPS
          MATHBEPC_STORE_FILE=mathbepc-release.jks
          MATHBEPC_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MATHBEPC_KEY_ALIAS=$KEY_ALIAS
          MATHBEPC_KEY_PASSWORD=$KEY_PASSWORD
          PROPS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          marker='android {'
          signing='''android {\n    signingConfigs {\n        release {\n            storeFile file(project.findProperty("MATHBEPC_STORE_FILE"))\n            storePassword project.findProperty("MATHBEPC_STORE_PASSWORD")\n            keyAlias project.findProperty("MATHBEPC_KEY_ALIAS")\n            keyPassword project.findProperty("MATHBEPC_KEY_PASSWORD")\n        }\n    }'''
          s=s.replace(marker,signing,1)
          s=s.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release',1)
          p.write_text(s)
          PY
      - name: Compiler APK et AAB Release
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace
      - name: Préparer les artefacts
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/release/app-release.apk "artifact/MathBEPC-v${APP_VERSION}-release.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "artifact/MathBEPC-v${APP_VERSION}-release.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: MathBEPC-v${{ env.APP_VERSION }}-Release
          path: artifact/*
          retention-days: 30
